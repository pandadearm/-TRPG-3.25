<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生命計算器｜無限流 TRPG 正式版 3.25</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf3f6,#f8f5ef 55%,#e7eef0);color:#172c3e;font:16px system-ui,"Microsoft JhengHei",sans-serif}.page{min-height:100vh;padding:clamp(18px,4vw,58px)}.header,.calculator{max-width:1240px;margin-left:auto;margin-right:auto}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow,.kicker{margin:0 0 5px;color:#58738c;font-size:12px;font-weight:800;letter-spacing:.1em}.header h1{margin:0;font-size:clamp(32px,5vw,50px);letter-spacing:.04em}.description{max-width:610px;margin:10px 0 0;color:#526a7d;line-height:1.6}.library-link{border:1px solid #9eb3c2;border-radius:9px;padding:10px 13px;background:#fffdf9;color:#244c69;font-weight:700;text-decoration:none;white-space:nowrap}.calculator{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(390px,.95fr);gap:22px}.state-column,.action-column{display:flex;min-width:0;flex-direction:column;gap:22px}.panel,.record-panel{border:1px solid #d6e0e3;border-radius:16px;padding:clamp(18px,3vw,30px);background:#fffdf9;box-shadow:0 12px 32px #304b5a14}.panel-heading,.record-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.panel-heading h2,.record-heading h2{margin:0;color:#1d4059;font-size:22px}.status,.record-status{display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800;white-space:nowrap}.status-alive{background:#dff4e6;color:#17643f}.status-unconscious{background:#fff0c7;color:#8d5b00}.status-dead{background:#f7dde1;color:#972b3a}.record-status{background:#e7f0f4;color:#2e5874}.current-inputs,.damage-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.number-field{display:flex;min-width:0;flex-direction:column;gap:7px;border-radius:10px;padding:11px 12px;background:#f4f7f6;color:#3f5e72;font-size:13px;font-weight:800}.number-field input{width:100%;min-width:0;border:1px solid #bdcdd5;border-radius:7px;padding:9px 10px;background:#fff;color:#162b3c;font-size:20px;font-weight:750;line-height:1}.number-field input:focus{outline:3px solid #b9d9e555;border-color:#4d87a3}.max-health{background:#edf3f7}.temporary{background:#e4f3fb}.injury-b{background:#fff0dc}.injury-l{background:#ffe6e5}.injury-a{background:#f0e5f5}.help{margin:16px 0 0;color:#607788;font-size:13px;line-height:1.55}.vital-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.vital-card{min-height:104px;border:1px solid transparent;border-radius:14px;padding:15px;display:flex;flex-direction:column;justify-content:space-between}.vital-card span{font-size:13px;font-weight:750}.vital-card strong{font-size:30px;line-height:1}.vital-intact{background:#e3f5e8;border-color:#bfe3c9;color:#206841}.vital-b{background:#fff0dc;border-color:#f2cf9e;color:#96530b}.vital-l{background:#ffe5e5;border-color:#ebbcbc;color:#a62d34}.vital-a{background:#f0e2f6;border-color:#d9bce5;color:#63336f}.vital-temp{background:#e2f3fb;border-color:#b8ddea;color:#22627c}.status-card{color:#243c50}.status-card strong{font-size:25px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.actions button{border:1px solid transparent;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.apply{background:#267b52;color:#fff}.undo{border-color:#9bb2c0!important;background:#edf4f8;color:#31566d}.undo:disabled{cursor:not-allowed;opacity:.45}.reset{border-color:#e1bcbc!important;background:#fff6f4;color:#9f463b}.record-panel{flex:1;background:#1b3447;color:#eef6f8;border-color:#1b3447}.record-panel .kicker{color:#b7d6e4}.record-panel h2{color:#fff}.record-list{display:grid;gap:0;margin:0;padding:0;list-style:none;border-top:1px solid #496275}.record-list li{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #496275;font-size:14px}.record-list span{color:#b9d6e3}.record-list strong{text-align:right}.empty-record{margin:0;color:#c1d7e2;line-height:1.65}.willpower{margin:18px 0 0;border-radius:9px;padding:10px 12px;background:#2b4b60;color:#d7e9ef;font-size:13px;line-height:1.5}@media(max-width:840px){.calculator{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.vital-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.page{padding:16px 12px 28px}.header{margin-bottom:18px}.header h1{font-size:34px}.library-link{width:100%;text-align:center}.calculator{gap:14px}.panel,.record-panel{border-radius:13px;padding:17px 14px}.panel-heading,.record-heading{align-items:flex-start}.panel-heading h2,.record-heading h2{font-size:20px}.current-inputs,.damage-inputs,.vital-grid{grid-template-columns:1fr}.number-field{padding:10px 11px}.vital-card{min-height:78px;flex-direction:row;align-items:center}.vital-card strong{font-size:28px}.actions{display:grid;grid-template-columns:1fr}.actions button{min-height:44px}.record-list li{align-items:flex-start;flex-direction:column;gap:3px}.record-list strong{text-align:left}.status{padding:6px 9px}}
  </style>
</head>
<body>
  <main id="life-calculator"></main>
  <script src="life-calculator.js"></script>
</body>
</html>
